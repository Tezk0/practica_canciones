<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <title>{{ cancion.titulo }}</title>
</head>
<body>
    <h1 class="h1titulo">{{ cancion.titulo }}</h1>
    <h3>{{ cancion.artista }}</h3>
    <div class="divgrandepacancion">
        <div class="divchicopacancion1">
            <table>
                <thead>
                    <th>En los favoritos de:</th>
                </thead>
                <tbody>
                    {% for usuario in usuarios_favoritos %}
                        <td>-{{ usuario.nombre }}</td>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="divchicopacancion2">
            <h1>Agregar Favorito</h1>
            <form action="/Agregar_usuario_fav" method="post">
                <input type="hidden" name="cancion_id" value="{{ cancion.id }}">
                <label for="">Usuario</label>
                <select name="usuario_id" id="">
                    {% for usuario in usuarios %}
                        {% if usuario.id not in usuarios_favoritos_ids %}
                        <option value="{{ usuario.id }}">
                            {{ usuario.nombre }}
                        </option>
                        {% else %}
                        {# ta vacio #}
                        {% endif %}
                    {% endfor %}
                </select>
                <input type="submit" value="Agregar">
            </form>
        </div>
    </div>
    <a href="/">Inicio</a>
</body>
</html>
