<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <title>Usuario numero {{ usuario.id }}</title>
</head>
<body>
    <h1 class="nombredelusuario">{{ usuario.nombre }}</h1>
    <div class="divgrandedeusuarios">
        <div class="favoritos">
            <h1>Favoritos</h1>
            <table>
                <thead>
                    <tr class="table_title">
                        <th>Cancion</th>
                        <th>Artista</th>
                    </tr>
                </thead>
                <tbody>
                {% for cancion in favoritos %}
                    <tr>
                        <td>{{ cancion.titulo }}</td>
                        <td>{{ cancion.artista }}</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
            <a href="/">Volver</a>
        </div>

        <div class="agregar_fav">
            <h1>Agregar Favorito</h1>
            <h2>Cancion: </h2>
            <form action="/Add_favorito" method="post">
            <input type="hidden" name="usuario_id" value="{{ usuario.id }}">

                <select name="cancion_id" required>
                    {% for cancion in canciones %}
                    <option value= "{{ cancion.id }}">
                        {{ cancion.titulo }}
                    </option>
                    {% endfor %}
                </select>
                <input type="submit" value="Agregar">
            </form>
        </div>
    </div>
</body>
</html>
